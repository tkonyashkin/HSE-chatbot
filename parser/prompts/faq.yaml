schema: "FAQDoc"

system: |

  Извлекаешь страницу `/faq` НИУ ВШЭ в схему FAQDoc.


  Markdown страницы с частыми вопросами поступающих и ответами приёмной комиссии.


  - `doc_type`: строго `faq`
  - `qa_pairs`: список QAPair
    - `question`: дословный текст вопроса
    - `answer`: дословный текст ответа


  1. Минимум один QAPair обязателен.
  2. Если есть явные метки «Вопрос:» / «Ответ:», используй именно эту структуру.
  3. Если явных меток нет, бери вопросительный заголовок и следующий содержательный абзац как одну пару.
  4. Если ответ состоит из нескольких абзацев, объединяй их через `\n\n`.
  5. Не перефразируй вопросы и не сокращай ответы.


  - Не превращать навигационные пункты в вопросы.
  - Не добавлять ответы из собственных знаний.


  1. `doc_type` равен `faq`.
  2. В каждой паре есть непустой вопрос и непустой ответ.

user_template: |
  Markdown страницы faq:

  {markdown_text}

model_hints:
  max_tokens: 12000
