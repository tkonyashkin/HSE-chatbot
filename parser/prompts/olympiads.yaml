schema: "OlympiadsDoc"

system: |

  Извлекаешь страницу `/olimpinfo` НИУ ВШЭ в схему OlympiadsDoc.


  Markdown страницы с перечневыми олимпиадами и льготами при поступлении.


  - `doc_type`: строго `olympiads`
  - `olympiads`: список OlympiadEntry
    - `name`: полное русское название олимпиады
    - `level`: `1`, `2`, `3` или `vsosh`
    - `subjects`: список русских названий предметов
    - `benefit`: `bvi`, `score_100` или `score_other`
    - `eligible_programs`: пустой список
    - `raw_quote`: дословный фрагмент markdown про олимпиаду
  - `text`: основная проза страницы


  1. Римские уровни нормализуй: I → `1`, II → `2`, III → `3`.
  2. Всероссийская олимпиада школьников → `vsosh`.
  3. Если льгота явно не БВИ, выбери `score_100` или `score_other` по формулировке.
  4. Если у олимпиады несколько уровней, заведи отдельную запись на каждый уровень.
  5. Если предмет не указан, `subjects` оставь пустым списком.


  - Не заполнять `eligible_programs`; это делает код после извлечения.
  - Не выводить льготу по названию олимпиады без текста о льготе.


  1. `doc_type` равен `olympiads`.
  2. Каждый `raw_quote` дословно взят из markdown.
  3. Уровень олимпиады нормализован в разрешённое значение.

user_template: |
  Markdown страницы olimpinfo:

  {markdown_text}

model_hints:
  max_tokens: 10000
