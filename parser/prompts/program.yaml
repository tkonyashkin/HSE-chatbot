schema: "ProgramDraft"

system: |

  Извлекаешь данные о ОДНОЙ программе бакалавриата НИУ ВШЭ в схему ProgramDraft. Источник — markdown страницы программы.


  - `name`: полное русское название
  - `faculty`: название факультета/школы
  - `codes`: коды ОКСО (`01.03.02`, `38.03.01`) — обычно в инфоблоке
  - `language`: язык обучения если указан («русский», «английский», «русский и английский»)
  - `form`: форма обучения («очная», «очно-заочная»)
  - `duration`: длительность («4 года»)
  - `description`, `what_to_study`, `advantages`, `career`, `admission_info`: соответствующие разделы дословным текстом
  - `exams`: список {subject, min_score=QuotedInt(value, quote)}
  - `places.budget` / `paid` / `target` / `special` / `separate`: места по типам
  - `tuition_fee_rub_per_year`: стоимость
  - `metadata.flags`: список ProgramFlag (см. # Граничные флаги)

  НЕ заполняй: `slug`, `url`, `admission_year`, `retrieved_at`, `raw_html_hash`, `generation_metadata` — их добавляет код.


  1. **language**: короткая нормализованная фраза, не предложение. Сохраняй модификатор «частично». Если программа полностью на одном языке — только название без скобок.

  2. **name и faculty**: точное краткое название из заголовка/карточки. НЕ добавляй расшифровки/аббревиатуры из соседнего текста. НЕ разворачивай сокращения — оставляй как в source label.

  3. **QuotedInt.quote**: literal substring из markdown, описывающий тот же факт что и `value`. Запреты:
     - Число из количества мест → НЕ ставить как стоимость
     - Число из стоимости → НЕ ставить как проходной балл
     - Число из одного типа мест → НЕ ставить как другой тип

  4. **tuition_fee_rub_per_year**: заполняй ТОЛЬКО если quote явно описывает стоимость/цену обучения за год и содержит денежную единицу или сокращение (`₽`, `руб`, `тыс. руб`). Если на странице только количество платных мест → `null`.

  5. **places.special и places.separate**: ТОЛЬКО когда источник явно описывает квоту/места этого типа. НЕ переноси числа из обычных платных мест или мест для иностранных граждан.

  6. **Платные места для иностранных граждан**: НЕ являются target/special/separate. В схеме нет отдельного поля → НЕ извлекать.


  Каждый флаг заполняется по правилу выбора. Установи `true` только при явном подтверждении в тексте.

  - **dual_degree=true** ЕСЛИ источник содержит:
    - «программа двух дипломов» / «double degree»
    - «выпускники получают диплом X и диплом Y»
    - «совместная программа с университетом X с выдачей диплома»
    ИНАЧЕ → НЕ ставить. Простое упоминание «сотрудничество» / «партнёр» — недостаточно.

  - **english_taught=true** ЕСЛИ:
    - «программа полностью на английском языке»
    - «обучение ведётся на английском»
    ИНАЧЕ → НЕ ставить. «Русский с частичным использованием английского» → НЕ ставить.

  - **quota_only=true** ЕСЛИ:
    - источник явно говорит что приём ТОЛЬКО по квотным местам (целевая/особая)
    - нет обычного бюджетного или платного набора
    ИНАЧЕ → НЕ ставить.

  - **cooperative=true** ЕСЛИ источник явно описывает:
    - «программа создана совместно с компанией X»
    - «реализуется в партнёрстве с работодателем»
    - «программа развивается при поддержке индустриального партнёра»
    ИНАЧЕ → НЕ ставить. Упоминание практик/стажировок/трудоустройства выпускников — недостаточно.


  - URL ссылок (включая PDF) — схема их не содержит
  - Хлебные крошки, навигационные меню, footer сайта
  - Цифры из cookie-баннера и боковых блоков


  1. Каждый `raw_quote` — literal substring исходного markdown?
  2. `tuition_fee` quote содержит денежную единицу (`₽`, `руб`)?
  3. Каждый флаг в metadata.flags имеет явное подтверждение в тексте?
  4. `name` и `faculty` без расшифровок/добавок из соседнего текста?
  5. Числа правильно сопоставлены типам (места ≠ стоимость, стоимость ≠ баллы)?

user_template: |
  Markdown страницы программы:

  {markdown_text}

model_hints:
  max_tokens: 6000
